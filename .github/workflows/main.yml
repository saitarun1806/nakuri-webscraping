name: Naukri Job Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

# Prevent two scraper runs from pushing to main simultaneously
concurrency:
  group: naukri-job-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Chrome + ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Run scraper
        run: python scraper_worker.py

      - name: Upload results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: naukri-jobs-data
          path: |
            state_csvs/*.csv
            naukri_jobs_all_india.csv
            naukri_jobs_all_india.json
          retention-days: 14

      - name: Commit and push results to repo
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"

          git add naukri_jobs_all_india.csv
          git add naukri_jobs_all_india.json

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update Naukri jobs data - $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Get the latest version of main
          git fetch origin main

          # Place our scraper results on top of the latest main
          git rebase origin/main

          # Push the rebased commit
          git push origin HEAD:main
